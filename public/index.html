<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar de Ofertas 🔥</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
      header { padding: 20px 24px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 20px; margin: 0; }
      .muted { color: #8b949e; font-size: 13px; }
      button { cursor: pointer; border: 1px solid #30363d; background: #161b22; color: #e6edf3; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
      button:hover { background: #21262d; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 20px 24px; }
      .card { border: 1px solid #21262d; border-radius: 12px; padding: 14px; background: #161b22; display: flex; flex-direction: column; gap: 8px; }
      .thumb { width: 100%; height: 170px; object-fit: contain; background: #fff; border-radius: 8px; }
      .title { font-weight: 600; font-size: 15px; line-height: 1.3; }
      .range { font-size: 12px; color: #8b949e; }
      .spark { font-family: monospace; letter-spacing: 1px; color: #3fb950; font-size: 15px; }
      .lowest { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #2ea04333; color: #3fb950; font-weight: 700; }
      .price { font-size: 22px; font-weight: 700; color: #3fb950; }
      .old { text-decoration: line-through; color: #8b949e; font-size: 14px; margin-left: 6px; }
      .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1f6feb33; color: #79c0ff; }
      .src { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #8b949e; }
      .ai { font-size: 13px; color: #d29922; font-style: italic; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
      .row a { color: #58a6ff; text-decoration: none; font-size: 13px; margin-left: auto; }
      .like.on { background: #238636; border-color: #2ea043; }
      .dislike.on { background: #da3633; border-color: #f85149; }
      .empty { padding: 60px 24px; text-align: center; color: #8b949e; }
      .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
      .modal.open { display: flex; }
      .modal-content { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 24px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .modal-header h2 { margin: 0; font-size: 18px; }
      .modal-close { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 24px; padding: 0; }
      .modal-close:hover { color: #e6edf3; }
      .chart-container { width: 100%; height: 300px; margin: 16px 0; }
      .chart-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; font-size: 13px; }
      .stat-box { border: 1px solid #21262d; border-radius: 8px; padding: 12px; background: #161b22; }
      .stat-label { color: #8b949e; margin-bottom: 4px; }
      .stat-value { font-size: 16px; font-weight: 600; color: #3fb950; }
    </style>
  </head>
  <body>
    <header>
      <h1>🔥 Radar de Ofertas</h1>
      <span class="muted" id="sub">carregando…</span>
      <span style="margin-left:auto"></span>
      <button onclick="crawl()" id="crawlBtn">⟳ Rodar ciclo</button>
      <button onclick="load()">Atualizar</button>
    </header>
    <div id="app" class="grid"></div>
    <div id="chartModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="chartTitle">Histórico de Preços</h2>
          <button class="modal-close" onclick="closeChart()">×</button>
        </div>
        <div class="chart-container">
          <canvas id="priceChart"></canvas>
        </div>
        <div class="chart-stats" id="chartStats"></div>
      </div>
    </div>
    <script>
      const BRL = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const SRC = { mercadolivre: "Mercado Livre", amazon: "Amazon", magalu: "Magazine Luiza" };

      async function load() {
        const r = await fetch("/api/deals?limit=60");
        const deals = await r.json();
        const app = document.getElementById("app");
        document.getElementById("sub").textContent = deals.length + " ofertas recentes";
        if (!deals.length) { app.innerHTML = '<div class="empty">Nenhuma oferta ainda. Clique em <b>Rodar ciclo</b>.</div>'; return; }
        app.innerHTML = deals.map(cardHtml).join("");
      }

      const BARS = "▁▂▃▄▅▆▇█";
      function spark(s) {
        if (!s || s.length < 2) return "";
        const mn = Math.min(...s), mx = Math.max(...s), r = (mx - mn) || 1;
        return s.map(v => BARS[Math.min(7, Math.floor((v - mn) / r * 7))]).join("");
      }

      function cardHtml(d) {
        const ai = d.ai_comment ? `<div class="ai">🤖 ${esc(d.ai_comment)}</div>` : "";
        const img = d.image ? `<img class="thumb" src="${d.image}" loading="lazy" onerror="this.style.display='none'">` : "";
        const lowest = (d.min_price && d.price <= d.min_price + 0.001) ? `<span class="lowest">🏆 menor preço histórico</span>` : "";
        const sp = spark(d.series);
        return `<div class="card">
          ${img}
          <div class="src">${SRC[d.source] || d.source} · ${d.category}</div>
          <div class="title">${esc(d.title)}</div>
          <div><span class="price">${BRL(d.price)}</span><span class="old">${BRL(d.avg_price)}</span></div>
          <div><span class="badge">-${d.discount_pct.toFixed(0)}% · score ${(d.score*100).toFixed(0)}</span> ${lowest}</div>
          <div class="range">📊 mín ${BRL(d.min_price)} · máx ${BRL(d.max_price)} · ${d.points} leituras</div>
          ${sp ? `<div class="spark">${sp}</div>` : ""}
          ${ai}
          <div class="row">
            <button class="like" onclick="vote(${d.id},1,this)">👍 Curtir</button>
            <button class="dislike" onclick="vote(${d.id},-1,this)">👎</button>
            <button onclick="showChart(${d.id}, '${esc(d.title)}', ${JSON.stringify(d.series)})">📈 Histórico</button>
            <a href="${d.url}" target="_blank" rel="noopener">ver produto →</a>
          </div>
        </div>`;
      }

      async function vote(id, v, btn) {
        const res = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ dealId: id, vote: v }) });
        if (res.ok) {
          const card = btn.closest(".card");
          card.querySelectorAll("button").forEach(b => b.classList.remove("on"));
          btn.classList.add(v === 1 ? "on" : "on");
          btn.classList.add(v === 1 ? "like" : "dislike");
          btn.textContent = v === 1 ? "👍 Curtido!" : "👎 Anotado";
        }
      }

      async function crawl() {
        const b = document.getElementById("crawlBtn");
        b.disabled = true; b.textContent = "⟳ rodando…";
        try { await fetch("/api/crawl", { method: "POST" }); await load(); }
        finally { b.disabled = false; b.textContent = "⟳ Rodar ciclo"; }
      }

      function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

      function showChart(id, title, series) {
        if (!series || series.length < 2) {
          alert("Histórico insuficiente para gráfico");
          return;
        }
        document.getElementById("chartTitle").textContent = `Histórico: ${title}`;
        document.getElementById("chartModal").classList.add("open");
        drawChart(series);
        updateChartStats(series);
      }

      function closeChart() {
        document.getElementById("chartModal").classList.remove("open");
      }

      function drawChart(prices) {
        const canvas = document.getElementById("priceChart");
        const ctx = canvas.getContext("2d");
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        canvas.width = w;
        canvas.height = h;

        const mn = Math.min(...prices);
        const mx = Math.max(...prices);
        const range = mx - mn || 1;
        const padding = 40;

        ctx.fillStyle = "#0d1117";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#21262d";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, h - padding);
        ctx.lineTo(w - padding, h - padding);
        ctx.stroke();

        ctx.fillStyle = "#8b949e";
        ctx.font = "12px monospace";
        ctx.textAlign = "right";
        ctx.fillText(BRL(mx), padding - 10, padding + 5);
        ctx.fillText(BRL(mn), padding - 10, h - padding + 5);

        ctx.strokeStyle = "#58a6ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        prices.forEach((p, i) => {
          const x = padding + (i / (prices.length - 1)) * (w - 2 * padding);
          const y = h - padding - ((p - mn) / range) * (h - 2 * padding);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.fillStyle = "#3fb950";
        prices.forEach((p, i) => {
          const x = padding + (i / (prices.length - 1)) * (w - 2 * padding);
          const y = h - padding - ((p - mn) / range) * (h - 2 * padding);
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function updateChartStats(prices) {
        const mn = Math.min(...prices);
        const mx = Math.max(...prices);
        const avg = prices.reduce((a, b) => a + b) / prices.length;
        const current = prices[prices.length - 1];
        const chg = ((current - avg) / avg * 100).toFixed(1);
        document.getElementById("chartStats").innerHTML = `
          <div class="stat-box">
            <div class="stat-label">Mínimo</div>
            <div class="stat-value">${BRL(mn)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Máximo</div>
            <div class="stat-value">${BRL(mx)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Média</div>
            <div class="stat-value">${BRL(avg)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Atual vs Média</div>
            <div class="stat-value" style="color: ${chg < 0 ? '#3fb950' : '#f85149'}">${chg > 0 ? '+' : ''}${chg}%</div>
          </div>
        `;
      }

      window.addEventListener("click", (e) => {
        const modal = document.getElementById("chartModal");
        if (e.target === modal) modal.classList.remove("open");
      });

      load();
    </script>
  </body>
</html>
