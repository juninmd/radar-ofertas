<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar de Ofertas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --panel-2: #f1f3f5;
        --line: #e6e8eb;
        --txt: #16181d;
        --muted: #6b7280;
        --brand: #4f46e5;
        --brand-soft: #eef0ff;
        --green: #15803d;
        --green-soft: #e7f6ec;
        --red: #dc2626;
        --red-soft: #fdecec;
        --amber: #b45309;
        --radius: 16px;
        --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px -12px rgba(16,24,40,.18);
      }
      html.dark {
        --bg: #0b0d12;
        --panel: #14171e;
        --panel-2: #1b1f28;
        --line: #262b36;
        --txt: #eef1f6;
        --muted: #9aa3b2;
        --brand: #7c83ff;
        --brand-soft: #1c2030;
        --green: #4ade80;
        --green-soft: #14241a;
        --red: #f87171;
        --red-soft: #281517;
        --amber: #fbbf24;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--txt); -webkit-font-smoothing: antialiased; }
      a { color: inherit; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

      header {
        position: sticky; top: 0; z-index: 40;
        backdrop-filter: blur(10px);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-bottom: 1px solid var(--line);
      }
      .bar { max-width: 1280px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 18px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
      .brand .dot { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), #ec4899); display: grid; place-items: center; color: #fff; }
      .kpis { display: flex; gap: 18px; margin-left: 6px; }
      .kpi { font-size: 12px; color: var(--muted); }
      .kpi b { display: block; font-size: 16px; color: var(--txt); font-weight: 700; }
      .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      button, .btn {
        font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
        color: var(--txt); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600;
        display: inline-flex; align-items: center; gap: 7px; transition: .15s;
      }
      button:hover { border-color: var(--brand); }
      .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
      .btn.brand:hover { filter: brightness(1.08); }
      .icon { padding: 9px; }

      main { max-width: 1280px; margin: 0 auto; padding: 22px; }
      .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: .15s; }
      .chip:hover { color: var(--txt); }
      .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
      .grow { flex: 1; }
      .search { position: relative; }
      .search input, select.sort {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
        color: var(--txt); font-size: 13px; font-family: inherit; outline: none;
      }
      .search input { padding-left: 34px; width: 230px; }
      .search i { position: absolute; left: 10px; top: 9px; color: var(--muted); }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }

      .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .18s, border-color .18s; animation: rise .4s ease backwards; }
      .card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
      .thumb { position: relative; height: 180px; background: #fff; display: grid; place-items: center; padding: 14px; }
      .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; transition: .3s; }
      .thumb img.on { opacity: 1; }
      .badge { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 4px 8px; border-radius: 7px; }
      .s-mercadolivre { background: #ffe600; color: #2d3277; }
      .s-amazon { background: #ff9900; color: #111; }
      .s-magalu { background: #0086ff; color: #fff; }
      .s-kabum { background: #ff5500; color: #fff; }
      .s-aliexpress { background: #e62e04; color: #fff; }
      .s-shopee { background: #ee4d2d; color: #fff; }
      .s-casasbahia { background: #e30613; color: #fff; }
      .s-pontofrio, .s-extra { background: #00a868; color: #fff; }
      .bug { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 0 0 0 10px; display: flex; gap: 4px; align-items: center; }

      .body { padding: 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
      .cat { font-size: 10.5px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .04em; }
      .title { font-size: 14px; font-weight: 600; line-height: 1.35; height: 2.7em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .now { font-size: 21px; font-weight: 800; color: var(--green); }
      .was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
      .off { margin-left: auto; background: var(--red-soft); color: var(--red); font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 7px; }
      .tags { display: flex; gap: 6px; flex-wrap: wrap; }
      .tag { font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); padding: 3px 8px; border-radius: 6px; display: flex; gap: 4px; align-items: center; }
      .tag.good { color: var(--green); background: var(--green-soft); }
      .tag.bad { color: var(--red); background: var(--red-soft); }
      .ai { font-size: 12px; font-style: italic; color: var(--amber); background: color-mix(in srgb, var(--amber) 10%, transparent); border-left: 2px solid var(--amber); padding: 7px 10px; border-radius: 0 8px 8px 0; }
      .meter { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
      .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #ec4899); }
      .actions { display: flex; gap: 7px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: auto; }
      .actions .buy { flex: 1; justify-content: center; }

      .sk { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); height: 360px; overflow: hidden; }
      .sk .a { height: 180px; background: var(--panel-2); }
      .sk .b { height: 14px; margin: 14px; border-radius: 7px; background: var(--panel-2); }
      .sk .b.s { width: 55%; }
      .sk * { animation: pulse 1.4s infinite; }
      @keyframes pulse { 50% { opacity: .55; } }
      .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--muted); }

      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
      .overlay.open { display: flex; }
      .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 760px; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; }
      .modal .h { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .modal .h b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .modal .c { padding: 20px; overflow-y: auto; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
      .stat { background: var(--panel-2); border-radius: 12px; padding: 12px; text-align: center; }
      .stat .l { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .stat .v { font-size: 15px; font-weight: 800; margin-top: 3px; }
      .chartbox { height: 280px; }
      @media (max-width: 560px) { .stats { grid-template-columns: repeat(2,1fr); } .kpis { display: none; } .search input { width: 150px; } }

      .toast-wrap { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
      .toast { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 11px; padding: 11px 16px; font-size: 13px; font-weight: 600; display: flex; gap: 9px; align-items: center; transform: translateX(130%); transition: .3s cubic-bezier(.2,.9,.3,1.3); }
      .toast.on { transform: translateX(0); }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="brand"><span class="dot"><i data-lucide="flame" size="17"></i></span> Radar de Ofertas</div>
        <div class="kpis">
          <div class="kpi"><b id="k-deals">—</b> ofertas</div>
          <div class="kpi"><b id="k-sources">—</b> lojas</div>
          <div class="kpi"><b id="k-best">—</b> melhor desconto</div>
        </div>
        <div class="right">
          <button class="icon" onclick="toggleTheme()" title="Tema"><i data-lucide="moon" id="theme-i" size="17"></i></button>
          <button class="icon" onclick="openQueriesModal()" title="Configurações de Busca"><i data-lucide="settings" size="17"></i></button>
          <button id="btn-crawl" onclick="runCycle()"><i data-lucide="refresh-cw" size="15"></i> Rodar ciclo</button>
          <button class="btn brand" onclick="load()"><i data-lucide="zap" size="15"></i> Atualizar</button>
        </div>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <div class="grow"></div>
        <select class="sort" id="sort" onchange="render()">
          <option value="recent">Mais recentes</option>
          <option value="discount">Maior desconto</option>
          <option value="score">Maior score</option>
          <option value="price">Menor preço</option>
        </select>
        <div class="search">
          <i data-lucide="search" size="15"></i>
          <input id="q" placeholder="Buscar..." oninput="render()" />
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>

    <div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="h"><b id="m-title">Histórico</b><button class="icon" onclick="closeModal()"><i data-lucide="x" size="18"></i></button></div>
        <div class="c">
          <div class="stats" id="m-stats"></div>
          <div class="chartbox"><canvas id="chart"></canvas></div>
          <div id="m-ai" style="margin-top:16px"></div>
        </div>
      </div>
    </div>

    <div class="overlay" id="modal-queries" onclick="if(event.target===this)closeQueriesModal()">
      <div class="modal">
        <div class="h"><b>Termos de Busca Monitorados</b><button class="icon" onclick="closeQueriesModal()"><i data-lucide="x" size="18"></i></button></div>
        <div class="c">
          <p style="font-size:13px;color:var(--muted);margin-top:0;margin-bottom:16px">Adicione ou remova os termos que o crawler deve pesquisar nos e-commerces. As mudanças são salvas na base de dados.</p>
          <div style="display:flex;gap:8px;margin-bottom:18px">
            <input id="new-query-input" placeholder="Novo termo (ex: cadeira gamer)" style="flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:13px;outline:none" onkeydown="if(event.key==='Enter')addNewQuery()" />
            <button class="btn brand" onclick="addNewQuery()" style="padding:9px 16px"><i data-lucide="plus" size="15"></i> Adicionar</button>
          </div>
          <div id="queries-list" style="display:flex;flex-wrap:wrap;gap:8px"></div>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toasts"></div>

    <script>
      const SOURCES = [
        ["all", "Todas"], ["mercadolivre", "Mercado Livre"], ["amazon", "Amazon"], ["magalu", "Magalu"],
        ["kabum", "KaBuM!"], ["aliexpress", "AliExpress"], ["shopee", "Shopee"],
        ["casasbahia", "Casas Bahia"], ["pontofrio", "Ponto"], ["extra", "Extra"],
      ];
      const LABEL = Object.fromEntries(SOURCES);
      let deals = [], source = "all", chart = null;
      let dark = localStorage.getItem("theme") !== "light";

      const brl = (v) => (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const esc = (s) => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
      const ago = (d) => {
        const s = Math.floor((Date.now() - new Date(d)) / 1000);
        if (s < 60) return s + "s"; if (s < 3600) return Math.floor(s/60) + "min";
        if (s < 86400) return Math.floor(s/3600) + "h"; return Math.floor(s/86400) + "d";
      };

      function applyTheme() {
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        const i = document.getElementById("theme-i"); if (i) i.setAttribute("data-lucide", dark ? "moon" : "sun");
        lucide.createIcons();
      }
      function toggleTheme() { dark = !dark; localStorage.setItem("theme", dark ? "dark" : "light"); applyTheme(); }

      function buildChips() {
        document.getElementById("chips").innerHTML = SOURCES.map(([k, l]) =>
          `<div class="chip ${k === source ? "active" : ""}" data-k="${k}" onclick="setSource('${k}')">${l}</div>`
        ).join("");
      }
      function setSource(k) { source = k; buildChips(); render(); }

      function skeletons() {
        document.getElementById("grid").innerHTML = Array(8).fill(0).map(() =>
          `<div class="sk"><div class="a"></div><div class="b"></div><div class="b s"></div></div>`).join("");
      }

      async function load() {
        try {
          const r = await fetch("/api/deals?limit=200");
          deals = await r.json();
          render(); kpis();
        } catch (e) { toast("Falha ao carregar ofertas", "bad"); }
      }

      function kpis() {
        document.getElementById("k-deals").textContent = deals.length;
        document.getElementById("k-sources").textContent = new Set(deals.map(d => d.source)).size;
        const best = deals.reduce((m, d) => Math.max(m, d.discount_pct || 0), 0);
        document.getElementById("k-best").textContent = best > 0 ? "-" + best.toFixed(0) + "%" : "—";
      }

      function render() {
        const grid = document.getElementById("grid");
        const q = document.getElementById("q").value.toLowerCase();
        const sort = document.getElementById("sort").value;
        let list = deals.filter(d =>
          (source === "all" || d.source === source) &&
          (!q || d.title.toLowerCase().includes(q) || (d.category || "").toLowerCase().includes(q)));
        list.sort((a, b) =>
          sort === "discount" ? (b.discount_pct - a.discount_pct) :
          sort === "score" ? (b.score - a.score) :
          sort === "price" ? (a.price - b.price) :
          (new Date(b.created_at) - new Date(a.created_at)));

        if (!list.length) { grid.innerHTML = `<div class="empty">Nenhuma oferta encontrada.</div>`; return; }

        grid.innerHTML = list.map((d, i) => {
          const off = d.discount_pct > 0 ? `<span class="off">-${d.discount_pct.toFixed(0)}%</span>` : "";
          const was = d.price < d.avg_price ? `<span class="was">${brl(d.avg_price)}</span>` : "";
          const low = d.price <= d.min_price + 0.1 ? `<span class="tag good"><i data-lucide="award" size="11"></i> menor preço</span>` : "";
          const tr = d.trend ? `<span class="tag ${d.trend.direction==='falling'?'good':d.trend.direction==='rising'?'bad':''}"><i data-lucide="${d.trend.direction==='falling'?'trending-down':d.trend.direction==='rising'?'trending-up':'minus'}" size="11"></i> ${d.trend.direction==='falling'?'em queda':d.trend.direction==='rising'?'subindo':'estável'}</span>` : "";
          const ai = d.ai_comment ? `<div class="ai">${esc(d.ai_comment)}</div>` : "";
          return `<div class="card" style="animation-delay:${i*0.03}s">
            <div class="thumb">
              <span class="badge s-${d.source}">${LABEL[d.source] || d.source}</span>
              ${d.priceBug ? `<span class="bug"><i data-lucide="alert-triangle" size="11"></i> anomalia</span>` : ""}
              <img src="${d.image || ''}" loading="lazy" onload="this.classList.add('on')" onerror="this.style.display='none'">
            </div>
            <div class="body">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span class="cat">${esc(d.category || "geral")}</span>
                <span class="tag"><i data-lucide="clock" size="10"></i> ${ago(d.created_at)}</span>
              </div>
              <div class="title" title="${esc(d.title)}">${esc(d.title)}</div>
              <div class="prices"><span class="now">${brl(d.price)}</span>${was}${off}</div>
              <div class="tags">${low}${tr}</div>
              ${ai}
              <div class="meter" title="score ${(d.score*100).toFixed(0)}/100"><i style="width:${Math.min(100,d.score*100)}%"></i></div>
              <div class="actions">
                <button class="btn brand buy" onclick="window.open('${d.url}','_blank')"><i data-lucide="shopping-cart" size="15"></i> Comprar</button>
                <button class="icon" title="Histórico" onclick="openModal(${d.id})"><i data-lucide="line-chart" size="16"></i></button>
                <button class="icon" title="Gostei" onclick="vote(${d.id},1,this)"><i data-lucide="thumbs-up" size="16"></i></button>
                <button class="icon" title="Não gostei" onclick="vote(${d.id},-1,this)"><i data-lucide="thumbs-down" size="16"></i></button>
              </div>
            </div>
          </div>`;
        }).join("");
        lucide.createIcons();
      }

      async function vote(id, v, btn) {
        try {
          const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ dealId: id, vote: v }) });
          if (r.ok) { btn.style.color = v > 0 ? "var(--green)" : "var(--red)"; toast("Feedback registrado", "good"); }
          else toast("Não foi possível votar", "bad");
        } catch { toast("Erro ao votar", "bad"); }
      }

      async function runCycle() {
        const b = document.getElementById("btn-crawl");
        b.disabled = true; b.querySelector("i").style.animation = "pulse 1s infinite";
        toast("Varredura iniciada...", "brand");
        try { await fetch("/api/crawl", { method: "POST" }); toast("Ciclo concluído", "good"); load(); }
        catch { toast("Falha na varredura", "bad"); }
        finally { b.disabled = false; b.querySelector("i").style.animation = ""; }
      }

      function openModal(id) {
        const d = deals.find(x => x.id === id); if (!d) return;
        document.getElementById("m-title").textContent = d.title;
        const drop = d.avg_price > 0 ? ((d.avg_price - d.price) / d.avg_price * 100).toFixed(0) : 0;
        document.getElementById("m-stats").innerHTML = `
          <div class="stat"><div class="l">Atual</div><div class="v" style="color:var(--green)">${brl(d.price)}</div></div>
          <div class="stat"><div class="l">Mínimo</div><div class="v">${brl(d.min_price)}</div></div>
          <div class="stat"><div class="l">Máximo</div><div class="v">${brl(d.max_price)}</div></div>
          <div class="stat"><div class="l">Queda</div><div class="v" style="color:var(--red)">${drop}%</div></div>`;
        document.getElementById("m-ai").innerHTML = d.ai_comment ? `<div class="ai">${esc(d.ai_comment)}</div>` : "";
        drawChart(d.seriesDates || []);
        document.getElementById("modal").classList.add("open");
        lucide.createIcons();
      }
      function closeModal() { document.getElementById("modal").classList.remove("open"); }

      function drawChart(series) {
        const ctx = document.getElementById("chart").getContext("2d");
        if (chart) chart.destroy();
        const grid = dark ? "rgba(255,255,255,.06)" : "rgba(0,0,0,.06)";
        const tc = dark ? "#9aa3b2" : "#6b7280";
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: series.map(p => new Date(p.date).toLocaleDateString("pt-BR")),
            datasets: [{ data: series.map(p => p.price), borderColor: "#7c83ff", backgroundColor: "rgba(124,131,255,.12)", borderWidth: 2.5, fill: true, tension: .35, pointRadius: 3 }],
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
            scales: { x: { grid: { display: false }, ticks: { color: tc, font: { size: 10 } } }, y: { grid: { color: grid }, ticks: { color: tc, font: { size: 10 }, callback: v => "R$" + v } } } },
        });
      }

      function toast(msg, kind = "brand") {
        const colors = { brand: "var(--brand)", good: "var(--green)", bad: "var(--red)" };
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<i data-lucide="${kind==='bad'?'x-circle':'check-circle'}" style="color:${colors[kind]}"></i> ${msg}`;
        document.getElementById("toasts").appendChild(el);
        lucide.createIcons();
        requestAnimationFrame(() => el.classList.add("on"));
        setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 300); }, 2800);
      }

      async function loadQueries() {
        try {
          const r = await fetch("/api/queries");
          const list = await r.json();
          const listEl = document.getElementById("queries-list");
          listEl.innerHTML = list.map(q => 
            `<div class="chip active" style="display:inline-flex;align-items:center;gap:8px;cursor:default">${esc(q)} 
              <i data-lucide="x" size="13" style="cursor:pointer" onclick="deleteQuery('${esc(q)}')"></i>
             </div>`
          ).join("");
          lucide.createIcons();
        } catch { toast("Erro ao carregar termos", "bad"); }
      }
      async function addNewQuery() {
        const input = document.getElementById("new-query-input");
        const query = input.value.trim();
        if (!query) return;
        try {
          const r = await fetch("/api/queries", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ query })
          });
          if (r.ok) {
            input.value = "";
            toast("Termo adicionado", "good");
            loadQueries();
          } else { toast("Termo já existe ou é inválido", "bad"); }
        } catch { toast("Erro ao adicionar termo", "bad"); }
      }
      async function deleteQuery(query) {
        try {
          const r = await fetch("/api/queries", {
            method: "DELETE",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ query })
          });
          if (r.ok) {
            toast("Termo removido", "good");
            loadQueries();
          } else { toast("Erro ao remover termo", "bad"); }
        } catch { toast("Erro ao remover termo", "bad"); }
      }
      function openQueriesModal() { loadQueries(); document.getElementById("modal-queries").classList.add("open"); }
      function closeQueriesModal() { document.getElementById("modal-queries").classList.remove("open"); }

      applyTheme(); buildChips(); skeletons(); load();
      setInterval(load, 60000);
      window.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeQueriesModal(); } });
    </script>
  </body>
</html>
